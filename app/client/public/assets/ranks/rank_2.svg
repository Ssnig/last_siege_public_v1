<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGlow2)" />

  <!-- Winged / Chevron Back Accents -->
  <path d="M14 42 L64 10 L114 42 L106 50 L64 24 L22 50 Z" fill="#64748b" opacity="0.7" />

  <!-- Shield Base Outline -->
  <path d="M64 14 L108 30 C108 74 64 114 64 114 C64 114 20 74 20 30 Z"
        fill="url(#shieldGrad2)"
        stroke="url(#silverTrim)"
        stroke-width="5"
        stroke-linejoin="round"
        filter="drop-shadow(0 4px 10px rgba(0,0,0,0.65))" />

  <!-- Inner Inset Shield -->
  <path d="M64 24 L98 36 C98 70 64 102 64 102 C64 102 30 70 30 36 Z"
        fill="#0f172a"
        stroke="#94a3b8"
        stroke-width="2"
        opacity="0.9" />

  <!-- 2 Stars for Tier 2 -->
  <polygon points="51,36 53,43 61,43 55,48 57,56 51,51 45,56 47,48 41,43 49,43"
           fill="#f8fafc"
           stroke="#475569"
           stroke-width="1.2" />
  <polygon points="77,36 79,43 87,43 81,48 83,56 77,51 71,56 73,48 67,43 75,43"
           fill="#f8fafc"
           stroke="#475569"
           stroke-width="1.2" />

  <!-- Tier Badge Plate -->
  <rect x="40" y="68" width="48" height="22" rx="4"
        fill="url(#silverPlate)"
        stroke="#cbd5e1"
        stroke-width="2" />

  <!-- Roman Numeral "II" -->
  <text x="64" y="85"
        font-family="'MedievalSharp', 'Cinzel', serif, sans-serif"
        font-size="18"
        font-weight="900"
        fill="#f8fafc"
        text-anchor="middle">II</text>

  <!-- Subtitle Tag -->
  <text x="64" y="123"
        font-family="sans-serif"
        font-size="9"
        font-weight="bold"
        letter-spacing="1.5"
        fill="#cbd5e1"
        text-anchor="middle">SILVER</text>
</svg>
