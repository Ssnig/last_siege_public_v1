<!doctype html>
<html lang="en" style="background-color: #020617; width: 100%; height: 100%; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/metadata/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/metadata/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/metadata/favicon-16x16.png">
    <link rel="manifest" href="/metadata/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Almendra+SC&family=MedievalSharp&display=swap" rel="stylesheet">
    <title>Versus TD</title>
    <script>
      // Catch any unexpected early mobile JS error and show in clear banner
      window.addEventListener('error', function(e) {
        console.error('Mobile script error:', e);
        var el = document.getElementById('debug-mobile-err');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-mobile-err';
          el.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;z-index:999999;background:#b91c1c;color:#fff;padding:12px;border-radius:8px;font-size:12px;font-family:monospace;box-shadow:0 4px 16px rgba(0,0,0,0.8);word-break:break-all;';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        el.textContent = 'Script Error: ' + (e.message || 'Load error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Promise Rejection:', e);
        var el = document.getElementById('debug-mobile-err');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-mobile-err';
          el.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;z-index:999999;background:#b91c1c;color:#fff;padding:12px;border-radius:8px;font-size:12px;font-family:monospace;box-shadow:0 4px 16px rgba(0,0,0,0.8);word-break:break-all;';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        el.textContent = 'Async Error: ' + (e.reason?.message || e.reason || 'Promise failed');
      });
    </script>
  </head>
  <body style="background-color: #020617; color: #ffffff; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;">
    <div id="root" style="width: 100%; height: 100%; background-color: #020617;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
