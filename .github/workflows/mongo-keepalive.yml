name: MongoDB keep-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MongoDB driver
        run: npm install --no-save --prefix "$RUNNER_TEMP/mongo-ping" mongodb@6

      - name: Ping MongoDB
        run: |
          cp .github/scripts/ping-mongo.mjs "$RUNNER_TEMP/mongo-ping/"
          node "$RUNNER_TEMP/mongo-ping/ping-mongo.mjs"
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
